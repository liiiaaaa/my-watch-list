<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Watch List</title>

  <style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Moirai+One&family=Archivo+Black&family=Archivo:wght@500;600;700&family=Italiana&display=swap');
    :root {
      --bg: #FFDFAF;
      --ink: #2A2520;
      --ink-soft: #7A6E62;
      --line: #E8E0D5;
      --accent: #FF9800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fraunces', Georgia, serif;
      background: #fff8f0;
      color: var(--ink);
      line-height: 1.5;
      padding: 2rem 1.25rem 5rem;
      max-width: 1100px;
      margin: 0 auto;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: 'Moirai One', serif;
      font-size: 75px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
  padding: 1rem 0.25rem 2.5rem;

      margin-bottom: 0.5rem;
    }

    body > p {
      color: var(--ink-soft);
      margin-bottom: 3rem;
      font-style: italic;
      font-size: 1rem;
    }

    h3 {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: normal;
      text-transform: none;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
      margin-top: 2.5rem;
      margin-bottom: 1.5rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .tab {
      background: none; border: none;
      padding: 0.5rem 0;
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.75rem;
      color: rgba(255, 152, 0, 0.45);
      cursor: pointer;
      text-transform: uppercase;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s;
    }
    .tab:hover { color: rgba(255, 152, 0, 0.8); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Filters */
 .filters {
      padding: 1.25rem 0;
      margin-bottom: 3rem;
    }

    .filter-group {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0;
      margin-bottom: 0.75rem;
    }

    .filter-group:last-of-type {
      margin-bottom: 0;
    }

    .filter-label {
      font-family: 'Archivo Black', sans-serif;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.3;
      color: #d4602a;
      margin-right: 1.5rem;
      flex-shrink: 0;
      margin-bottom: 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      align-items: baseline;
    }

    .chip {
      font-family: 'Archivo', sans-serif;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #d4602a;
      opacity: 0.3;
      background: transparent;
      border: none;
      border-radius: 0;
      border-bottom: 3px solid transparent;
      padding: 0 0 3px 0;
      cursor: pointer;
      transition: all 0.2s;
      font-style: normal;
    }

    .chip:hover {
      opacity: 0.7;
      color: #e87840;
    }

    .chip.active {
      color: #e87840;
      opacity: 1;
      border-bottom: 3px solid #e87840;
    }

    /* Slash separator between chips */
    .chip:not(:last-child)::after {
      content: '/';
      margin-left: 0.5rem;
      margin-right: 0.5rem;
      opacity: 0.5;
      color: #d4602a;
      display: inline-block;
      pointer-events: none;
      border-bottom: none;
    }   

 .filter-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
    }
    .surprise-btn {
      background: #ebe9eb;
      color: var(--bg);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .surprise-btn:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }
    .count {
      font-size: 0.85rem;
      color: var(--ink-soft);
      font-style: italic;
    }

    /* Moodboard grid (horizontal scroll) */
    .grid {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 1rem;
      margin-bottom: 0.5rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .grid::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 45%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      scroll-snap-align: start;
      transition: transform 0.4s;
    }
    @media (min-width: 640px) { .card { flex: 0 0 28%; } }
    @media (min-width: 900px) { .card { flex: 0 0 20%; } }

    .card.highlighted { transform: scale(1.05); }
    .card.highlighted .poster { box-shadow: 0 0 0 4px var(--accent); }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: var(--line);
      background-size: cover;
      background-position: center;
      border-radius: 4px;
      transition: opacity 0.4s ease, box-shadow 0.4s;
      opacity: 0;
    }
    .poster.loaded { opacity: 1; }
    .poster.no-poster {
      opacity: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--ink-soft);
      font-style: italic;
    }

    .meta { display: flex; flex-direction: column; gap: 0.1rem; }
    .title { font-size: 0.95rem; line-height: 1.25; font-weight: 500; }
    .year { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .era-tag { color: var(--ink-soft); font-style: italic; }

    .empty {
      font-style: italic;
      color: var(--ink-soft);
      padding: 2rem 0;
    }
  /* Surprise Me overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 37, 32, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.2s ease;
    }

    .overlay.hidden { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay-content {
      background: var(--bg);
      padding: 2rem;
      border-radius: 12px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .overlay-label {
      font-family: 'Fraunces', serif;
font-size: 1.2rem;
      color: var(--ink-soft);
      margin-bottom: 1rem;
    }

    .overlay-poster {
      width: 200px;
      aspect-ratio: 2 / 3;
      background-color: var(--line);
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      margin: 0 auto 1.5rem;
    }

    .overlay-title {
      font-family: 'Georgia', serif;
      font-size: 1.5rem;
      line-height: 1.15;
      color: black;
      margin-bottom: 0.5rem;
    }

    .overlay-meta {
      font-size: 0.9rem;
      color: var(--ink-soft);
      font-style: italic;
      margin-bottom: 1.5rem;
    }

    .overlay-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .overlay-btn-primary, .overlay-btn-secondary {
      font-family: 'Georgia', serif;
padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-family: 'Archivo Black', serif;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .overlay-btn-primary {
      background: var(--ink);
      color: var(--bg);
    }
    .overlay-btn-primary:hover { background: var(--accent); }

    .overlay-btn-secondary {
     font-family: 'Georgia', serif;
 background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    .overlay-btn-secondary:hover { background: var(--ink); color: var(--bg); }
.surprise-btn {
      display: inline-flex;
      align-items: center;
    }

    .surprise-text {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width 0.3s ease, opacity 0.3s ease, margin-left 0.3s ease;
    }

    .surprise-btn:hover .surprise-text {
      max-width: 200px;
      opacity: 1;
      margin-left: 0.4rem;
    }
/* Watched state */
    .card { cursor: pointer; transition: opacity 0.3s; }
    .card:hover { opacity: 0.85; }

    .card.watched { opacity: 0.4; }
    .card.watched:hover { opacity: 0.55; }
    .card.watched .poster { filter: grayscale(0.7); }
    .card.watched .title { text-decoration: line-through; color: var(--ink-soft); }

  .overlay-content { position: relative; }

    .overlay-close-x {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .overlay-close-x:hover {
      color: #FF9800;
    }
.tab[data-type="Watched"] { margin-left: auto; }
/* Home view */
        body.home-mode .tabs,
    body.home-mode .filters,
    body.home-mode .identity-toggle,
    body.home-mode .add-btn {
      display: none;
    }

    /* Home view — moodboard collage */
    .home-collage {
      position: relative;
      margin-top: 1rem;
      min-height: 800px;
    }

    .collage-item {
      position: absolute;
      width: 22%;
      max-width: 240px;
      transition: transform 0.3s ease;
    }

    .collage-item .poster {
      width: 100%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      border-radius: 2px;
    }

    .collage-item:nth-child(1)  { top: 0%;  left: 5%;  transform: rotate(-3deg); z-index: 1; }
    .collage-item:nth-child(2)  { top: 8%;  left: 22%; transform: rotate(2deg);  z-index: 2; }
    .collage-item:nth-child(3)  { top: 2%;  left: 40%; transform: rotate(-2deg); z-index: 3; }
    .collage-item:nth-child(4)  { top: 10%; left: 58%; transform: rotate(3deg);  z-index: 4; }
    .collage-item:nth-child(5)  { top: 4%;  left: 75%; transform: rotate(-4deg); z-index: 5; }
    .collage-item:nth-child(6)  { top: 38%; left: 12%; transform: rotate(-3deg); z-index: 6; }
    .collage-item:nth-child(7)  { top: 42%; left: 30%; transform: rotate(2deg);  z-index: 7; }
    .collage-item:nth-child(8)  { top: 38%; left: 48%; transform: rotate(-2deg); z-index: 8; }
    .collage-item:nth-child(9)  { top: 44%; left: 66%; transform: rotate(4deg);  z-index: 9; }
    .collage-item:nth-child(10) { top: 70%; left: 20%; transform: rotate(-3deg); z-index: 10; }
    .collage-item:nth-child(11) { top: 72%; left: 48%; transform: rotate(2deg);  z-index: 11; }

    .collage-item:hover { z-index: 100 !important; }
    .collage-item:hover .poster { transform: scale(1.05); }

    @media (max-width: 640px) {
      .home-collage { min-height: 600px; }
      .collage-item { width: 38%; }
      .collage-item:nth-child(1)  { top: 0%;  left: 2%;  }
      .collage-item:nth-child(2)  { top: 8%;  left: 32%; }
      .collage-item:nth-child(3)  { top: 2%;  left: 60%; }
      .collage-item:nth-child(4)  { top: 25%; left: 10%; }
      .collage-item:nth-child(5)  { top: 28%; left: 45%; }
      .collage-item:nth-child(6)  { top: 32%; left: 75%; }
      .collage-item:nth-child(7)  { top: 50%; left: 5%;  }
      .collage-item:nth-child(8)  { top: 52%; left: 35%; }
      .collage-item:nth-child(9)  { top: 55%; left: 65%; }
      .collage-item:nth-child(10) { top: 75%; left: 15%; }
      .collage-item:nth-child(11) { top: 78%; left: 50%; }
    }
/* Ciclos */
    body.ciclos-mode .filters { display: none; }

    .ciclo { margin-bottom: 3rem; }

    .ciclo h3 {
      font-family: 'Archivo Black', serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .ciclo-description {
      font-style: italic;
      margin-bottom: 1.5rem;
      max-width: 500px;
    }

    .ciclo-why {
      font-size: 0.75rem;
      font-style: italic;
      margin-top: 0.2rem;
      line-height: 1.35;
    }
/* Ciclo watched state — orange overlay, grey meta */
    .ciclo-card .poster { position: relative; }

    .ciclo-card.ciclo-watched .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--accent);
      opacity: 0.5;
      border-radius: 4px;
      pointer-events: none;
    }

    .ciclo-card.ciclo-watched .title,
    .ciclo-card.ciclo-watched .year,
    .ciclo-card.ciclo-watched .ciclo-why {
      color: var(--ink-soft);
    }
/* Alt h1 style for non-home tabs (Movies, Series, Ciclos, Watched) */
    body:not(.home-mode) h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 500;
      color: var(--accent);
      letter-spacing: -0.025em;
      line-height: 0.95;
      margin-top: 0.5rem;
      margin-bottom: 2.5rem;
      font-variation-settings: 'opsz' 144;
    }

    body:not(.home-mode) .title-mark {
      display: none;
    }

.tab[data-type="Ciclos"] {
      font-family: 'Italiana', serif;
      font-size: 2.25rem;
      text-transform: none;
      letter-spacing: 0.02em;
    }
 /* Ciclos: dark editorial mode */
     body {
      transition: background 0.5s ease, color 0.5s ease;
    }

    body.ciclos-mode {
      background: #2A2520;
      color: #F2F2F2;
    }

    body.ciclos-mode .ciclo-description,
    body.ciclos-mode .year,
    body.ciclos-mode .ciclo-why {
      color: #B8B0A4;
    }

    body.ciclos-mode .ciclo h3,
    body.ciclos-mode h1 {
      color: #FFC4EB; 
    }
/* Bitmap divider — three orange tones */
    #content > h3:not(:first-child)::before {
      content: "";
      display: block;
      width: 100%;
      height: 36px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 144 36'><rect x='0' y='0' width='6' height='6' fill='%23FF9800'/><rect x='36' y='0' width='6' height='6' fill='%23D26B2C'/><rect x='48' y='0' width='6' height='6' fill='%23FF9800'/><rect x='72' y='0' width='6' height='6' fill='%23FFCEA6'/><rect x='108' y='0' width='6' height='6' fill='%23FF9800'/><rect x='132' y='0' width='6' height='6' fill='%23D26B2C'/><rect x='12' y='12' width='6' height='6' fill='%23D26B2C'/><rect x='24' y='12' width='6' height='6' fill='%23FF9800'/><rect x='48' y='12' width='6' height='6' fill='%23FFCEA6'/><rect x='60' y='12' width='6' height='6' fill='%23FF9800'/><rect x='84' y='12' width='6' height='6' fill='%23D26B2C'/><rect x='96' y='12' width='6' height='6' fill='%23FF9800'/><rect x='120' y='12' width='6' height='6' fill='%23FFCEA6'/><rect x='0' y='24' width='6' height='6' fill='%23FFCEA6'/><rect x='12' y='24' width='6' height='6' fill='%23FF9800'/><rect x='36' y='24' width='6' height='6' fill='%23D26B2C'/><rect x='60' y='24' width='6' height='6' fill='%23FF9800'/><rect x='72' y='24' width='6' height='6' fill='%23FFCEA6'/><rect x='96' y='24' width='6' height='6' fill='%23FF9800'/><rect x='132' y='24' width='6' height='6' fill='%23D26B2C'/></svg>");
      background-repeat: repeat-x;
      background-position: center;
      margin: 2.5rem 0 2rem;
    }

/* Ciclos tab pink on hover (from any tab) */
    .tab[data-type="Ciclos"]:hover {
      color: #FFC4EB;
    }

    /* When in Ciclos mode — everything goes pink */
    body.ciclos-mode .tab {
      color: rgba(255, 196, 235, 0.45);
    }

    body.ciclos-mode .tab:hover {
      color: rgba(255, 196, 235, 0.8);
    }

    body.ciclos-mode .tab.active {
      color: #FFC4EB;
      border-bottom-color: #FFC4EB;
    }

    body.ciclos-mode h1 {
      color: #FFC4EB;
    }

    /* Identity toggle */
    .identity-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.4rem;
      z-index: 50;
      background: rgba(255, 248, 240, 0.9);
      padding: 0.35rem 0.5rem;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .identity-btn {
      font-family: 'Archivo', sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;

      color: var(--ink-soft);

      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .identity-btn:hover { color: var(--accent); }

    .identity-btn.active {
      background: var(--accent);
      color: white;
    }
    /* + Add button */
    .add-btn {
      position: fixed;
      bottom: 1.5rem;

  <script>
// ===== LIGHT PASSWORD GATE =====
    (function() {
      const PASSWORD = "28009"; 
      const STORAGE_KEY = "watchlist-auth";

      if (sessionStorage.getItem(STORAGE_KEY) === "ok") return;

      const entered = prompt("What's the password?");
      if (entered === PASSWORD) {
        sessionStorage.setItem(STORAGE_KEY, "ok");
      } else {
        document.body.innerHTML = '<p style="font-family:Fraunces,serif;font-style:italic;padding:3rem;text-align:center;color:#7A6E62">Wrong password. Refresh and try again.</p>';
        throw new Error("Access denied");
      }
    })();

    const TMDB_API_KEY = "2eb56c59812008f2b5eea7b900b4fc0d";
    // ===== IDENTITY (who is using the site) =====
    const IDENTITY_KEY = 'watchlist-identity';

    function getIdentity() {
      return localStorage.getItem(IDENTITY_KEY) || 'Eva';
    }

    function setIdentity(name) {
      localStorage.setItem(IDENTITY_KEY, name);
      renderIdentityToggle();
    }

    function renderIdentityToggle() {
      const current = getIdentity();
      document.querySelectorAll('.identity-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.user === current);
      });
    }

    document.querySelectorAll('.identity-btn').forEach(btn => {
      btn.addEventListener('click', () => setIdentity(btn.dataset.user));
    });

    renderIdentityToggle();
// ===== WATCHED STATE (saved per device) =====
    const WATCHED_KEY = 'watchlist-watched';

    function getWatched() {
      try {
        return new Set(JSON.parse(localStorage.getItem(WATCHED_KEY) || '[]'));
      } catch {
        return new Set();
      }
    }

    function saveWatched(set) {
      localStorage.setItem(WATCHED_KEY, JSON.stringify([...set]));
    }

    function isWatched(id) {
      return getWatched().has(id);
    }

    function toggleWatched(id) {
      const watched = getWatched();
      if (watched.has(id)) watched.delete(id); else watched.add(id);
      saveWatched(watched);
    }
    
    // ===== FIREBASE-LOADED WATCHLIST =====
    let firebaseWatchlist = [];
    let firebaseReady = false;

    function getActiveWatchlist() {
      return firebaseReady ? firebaseWatchlist : watchlist;
    }
    const watchlist = [];
    // ===== STATE =====
  const state = {
      activeTab: "Home",
      selectedCategories: new Set(),
    selectedEras: new Set(),
    selectedAddedBy: new Set()
    };
    const posterCache = {};

    function getItemId(item) {
      return `${item.type}-${item.title}-${item.year}`.replace(/[^a-zA-Z0-9]/g, "-");
    }

    // ===== FILTERING =====
    function getFiltered() {
      return getActiveWatchlist().filter(item => {
        const id = getItemId(item);
        const watched = isWatched(id);
        if (state.selectedAddedBy.size > 0 && !state.selectedAddedBy.has(item.addedBy)) return false;
        if (state.activeTab === 'Watched') {
          if (!watched) return false;
        } else {
          if (item.type !== state.activeTab) return false;
          if (watched) return false;
        }

        if (state.selectedCategories.size > 0 && !state.selectedCategories.has(item.category)) return false;
        if (state.activeTab !== 'Watched' && state.selectedEras.size > 0 && !state.selectedEras.has(item.era)) return false;

        return true;
      });
    }

    // ===== HOME VIEW =====
    // ===== CICLOS DATA =====
    const ciclos = [
      {
        name: "Billy Wilder — The Sharpest Mind in Hollywood",
        description: "A director's full arc across noir, comedy and drama — united by savage wit, moral ambiguity, and an unmatched ear for dialogue. The ideal first director ciclo: every film is a pleasure, none of them are difficult.",
        films: [
          { title: "Double Indemnity", year: 1944, why: "Where it begins: the definitive noir, and proof that Wilder could make darkness feel irresistible." },
          { title: "Sunset Boulevard", year: 1950, why: "Hollywood eating itself alive. One of the greatest films ever made, and his darkest." },
          { title: "Ace in the Hole", year: 1951, why: "His most cynical film and his most prophetic: media manipulation as spectacle. Shockingly modern." },
          { title: "Stalag 17", year: 1953, why: "A POW camp comedy-thriller that shouldn't work at all. It does, completely." },
          { title: "The Seven Year Itch", year: 1955, why: "Lighter Wilder, but the Marilyn Monroe sequences are cinema history." },
          { title: "Love in the Afternoon", year: 1957, why: "Wilder meets Audrey: romantic, elegant, and funnier than it looks." },
          { title: "Some Like It Hot", year: 1959, why: "Widely considered the greatest comedy ever made. It earns that title." },
          { title: "The Apartment", year: 1960, why: "His masterpiece. A film about loneliness dressed up as a romantic comedy. You will cry." },
          { title: "Irma la Douce", year: 1963, why: "Wilder and Jack Lemmon at their most loose and playful. A palate cleanser after The Apartment." },
          { title: "The Private Life of Sherlock Holmes", year: 1970, why: "Underseen, tender, melancholy. A surprising final note to a brilliant career." }
        ]
      },
      {
        name: "Audrey Hepburn — Grace as a Way of Being",
        description: "Not just a star ciclo — a portrait of a particular kind of female presence: intelligent, vulnerable, luminous. Follows her from ingénue to fully formed actress across fifteen years of Hollywood's most elegant era.",
        films: [
          { title: "Roman Holiday", year: 1953, why: "Her debut and her Oscar. The perfect entry point to understand everything that follows." },
          { title: "Sabrina", year: 1954, why: "Her first collaboration with Wilder: a Cinderella story with more edge than it lets on." },
          { title: "Funny Face", year: 1957, why: "Audrey as a bookish girl swept into the world of fashion. Visually ravishing, genuinely charming." },
          { title: "Love in the Afternoon", year: 1957, why: "Quieter and more melancholy than it appears. One of her most underrated performances." },
          { title: "The Nun's Story", year: 1959, why: "The film that proved she was more than charm. Rigorous, emotional, surprising." },
          { title: "Breakfast at Tiffany's", year: 1961, why: "The iconic one. Holly Golightly is one of cinema's great characters." },
          { title: "Charade", year: 1963, why: "Hitchcock-style thriller with Cary Grant. Pure fun, impeccably made." },
          { title: "My Fair Lady", year: 1964, why: "Her most epic film: a musical about transformation, class and voice. Magnificent." },
          { title: "Two for the Road", year: 1967, why: "The most modern film in the ciclo: a fractured, non-linear love story. Feels like it was made in 2005." },
          { title: "Wait Until Dark", year: 1967, why: "She plays a blind woman terrorised at home. Tense, brave, completely against type." }
        ]
      },
      {
        name: "Women Who Ran the Room — Hollywood 1945–1971",
        description: "A thematic journey through classic Hollywood via its most complex, ambitious female characters — not damsels, not sidekicks, but women who drive every scene they're in. Surprisingly contemporary in feeling, essential as cinema history.",
        films: [
          { title: "Brief Encounter", year: 1945, why: "A married woman, a chance meeting, an impossible love. Restrained and devastating. The template for every romantic drama that followed." },
          { title: "Mildred Pierce", year: 1945, why: "Joan Crawford at her most ferocious: a self-made woman undone by her own ambition and her daughter. Noir dressed as melodrama." },
          { title: "All About Eve", year: 1950, why: "The sharpest film ever made about ambition, ageing and female rivalry. Every line is a weapon." },
          { title: "Gentlemen Prefer Blondes", year: 1953, why: "Marilyn Monroe and Jane Russell running rings around every man in the film. Funnier and smarter than its reputation." },
          { title: "Rear Window", year: 1954, why: "Hitchcock's most playful thriller, with Grace Kelly as the most glamorous person ever to appear on screen." },
          { title: "Imitation of Life", year: 1959, why: "A melodrama about race, identity and maternal love that will wreck you. Lana Turner, but the film belongs to Juanita Moore." },
          { title: "The Children's Hour", year: 1961, why: "Audrey Hepburn and Shirley MacLaine in a film about a lesbian relationship accusation that was radical for its time and still stings." },
          { title: "The L-Shaped Room", year: 1962, why: "A single woman, pregnant and alone in a London bedsit. Quiet, truthful, British kitchen-sink at its most humane." },
          { title: "Bonnie and Clyde", year: 1967, why: "Faye Dunaway rewrites what a female lead can be: dangerous, sexual, fully alive. The film that broke old Hollywood open." },
          { title: "Klute", year: 1971, why: "Jane Fonda's career-defining performance as a call girl navigating a murder investigation. The most modern film in the ciclo by far." }
        ]
      }
    ];

    function renderCiclos() {
      let html = '';
      for (const ciclo of ciclos) {
        html += `<div class="ciclo">`;
        html += `<h3>${ciclo.name}</h3>`;
        html += `<p class="ciclo-description">${ciclo.description}</p>`;
        html += `<div class="grid">`;
        for (const film of ciclo.films) {
          const item = { ...film, type: 'Movie' };
          const id = getItemId(item);
          const isW = isWatched(id);
          html += `
            <div class="card ciclo-card${isW ? ' ciclo-watched' : ''}" data-id="${id}">
              <div class="poster" id="poster-${id}"></div>
              <div class="meta">
                <div class="title">${film.title}</div>
                <div class="year">${film.year}</div>
                <div class="ciclo-why">${film.why}</div>
              </div>
            </div>
          `;
        }
        html += `</div></div>`;
      }

      document.getElementById('content').innerHTML = html;

      for (const ciclo of ciclos) {
        for (const film of ciclo.films) {
          applyPoster({ ...film, type: 'Movie' });
        }
      }
    }

function renderHome() {
      const shuffled = [...getActiveWatchlist()].sort(() => Math.random() - 0.5);
      const picks = shuffled.slice(0, 11);

      let html = '<div class="home-collage">';
      for (const item of picks) {
        const id = getItemId(item);
        html += `<div class="collage-item"><div class="poster" id="poster-${id}"></div></div>`;
      }
      html += '</div>';

      document.getElementById('content').innerHTML = html;

      for (const item of picks) {
        applyPoster(item);
      }
    }

    function switchToTab(tabType) {
      document.querySelectorAll('.tab').forEach(b => {
        b.classList.toggle('active', b.dataset.type === tabType);
      });
      state.activeTab = tabType;
      state.selectedEras.clear();
      renderEraChips();
      render();
    }

// ===== RENDERING =====
   function render() {
      document.body.classList.toggle('home-mode', state.activeTab === 'Home');
      document.body.classList.toggle('ciclos-mode', state.activeTab === 'Ciclos');

      if (state.activeTab === 'Home') {
        renderHome();
        document.getElementById('result-count').textContent = '';
        return;
      }

      if (state.activeTab === 'Ciclos') {
        renderCiclos();
        document.getElementById('result-count').textContent = '';
        return;
      }

      const filtered = getFiltered();

      const grouped = {};
      for (const item of filtered) {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      }

      let html = "";
      if (filtered.length === 0) {
        html = `<p class="empty">No matches. Try removing a filter.</p>`;
      } else {
        for (const category in grouped) {
          html += `<h3>${category}</h3><div class="grid">`;
          for (const item of grouped[category]) {
            const id = getItemId(item);
            const watched = isWatched(id);
            const showAsWatched = watched && state.activeTab !== 'Watched';
            html += `
              <div class="card${showAsWatched ? ' watched' : ''}" data-id="${id}" title="Tap to mark watched/unwatched">
                <div class="poster" id="poster-${id}"></div>
                <div class="meta">
      <div class="title">${item.title}</div>
                  <div class="year">${item.year}
</span></div>
                </div>
              </div>
            `;
          }
          html += `</div>`;
        }
      }

      document.getElementById('content').innerHTML = html;

      for (const item of filtered) applyPoster(item);

      if (state.activeTab === 'Watched') {
        const count = filtered.length;
        document.getElementById('result-count').textContent =
          count === 1 ? '1 title' : `${count} titles`;
      } else {
        document.getElementById('result-count').textContent = '';
      };
    }

    function renderCategoryChips() {
      const categories = [...new Set(getActiveWatchlist().map(i => i.category))];
      document.getElementById('category-chips').innerHTML = categories.map(cat =>
        `<button class="chip${state.selectedCategories.has(cat) ? ' active' : ''}" data-category="${cat}">${cat}</button>`
      ).join('');
    }

    function renderEraChips() {
      const eraGroup = document.getElementById('era-group');

      if (state.activeTab === 'Watched') {
        eraGroup.style.display = 'none';
        return;
      }
      const addedByGroup = document.getElementById('addedby-group');
      if (addedByGroup) {
        addedByGroup.style.display = (state.activeTab === 'Watched') ? 'none' : '';
      }
      const eras = [...new Set(getActiveWatchlist().filter(i => i.type === state.activeTab).map(i => i.era))];
      if (eras.length <= 1) {
        eraGroup.style.display = 'none';
      } else {
        eraGroup.style.display = '';
        document.getElementById('era-chips').innerHTML = eras.map(era =>
          `<button class="chip${state.selectedEras.has(era) ? ' active' : ''}" data-era="${era}">${era}</button>`
        ).join('');
      }
    }

    // ===== POSTER FETCHING =====
    async function applyPoster(item) {
      const id = getItemId(item);
      const target = document.getElementById(`poster-${id}`);
      if (!target) return;

      if (posterCache[id] !== undefined) {
        if (posterCache[id] === 'no-poster') {
          target.classList.add("no-poster");
          target.innerText = item.title;
        } else {
          target.style.backgroundImage = `url('${posterCache[id]}')`;
          target.classList.add("loaded");
        }
        return;
      }

      const endpoint = item.type === "Movie" ? "movie" : "tv";
      const query = encodeURIComponent(item.title);
      const url = `https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_API_KEY}&query=${query}&year=${item.year}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const result = data.results && data.results[0];
        if (result && result.poster_path) {
          const imgUrl = `https://image.tmdb.org/t/p/w342${result.poster_path}`;
          posterCache[id] = imgUrl;
          target.style.backgroundImage = `url('${imgUrl}')`;
          target.classList.add("loaded");
        } else {
          posterCache[id] = 'no-poster';
          target.classList.add("no-poster");
          target.innerText = item.title;
        }
      } catch (err) {
        posterCache[id] = 'no-poster';
        target.classList.add("no-poster");
        target.innerText = item.title;
      }
    }

    // ===== EVENT HANDLERS =====
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.activeTab = btn.dataset.type;
        state.selectedEras.clear();
        renderEraChips();
        render();
      });
    });

    document.getElementById('category-chips').addEventListener('click', (e) => {
      if (!e.target.classList.contains('chip')) return;
      const cat = e.target.dataset.category;
      if (state.selectedCategories.has(cat)) {
        state.selectedCategories.delete(cat);
        e.target.classList.remove('active');
      } else {
        state.selectedCategories.add(cat);
        e.target.classList.add('active');
      }
      render();
    });

    document.getElementById('era-chips').addEventListener('click', (e) => {
      if (!e.target.classList.contains('chip')) return;
      const era = e.target.dataset.era;
      if (state.selectedEras.has(era)) {
        state.selectedEras.delete(era);
        e.target.classList.remove('active');
      } else {
        state.selectedEras.add(era);
        e.target.classList.add('active');
      }
      render();
    });
    document.getElementById('addedby-chips').addEventListener('click', (e) => {
      if (!e.target.classList.contains('chip')) return;
      const by = e.target.dataset.addedby;
      if (state.selectedAddedBy.has(by)) {
        state.selectedAddedBy.delete(by);
        e.target.classList.remove('active');
      } else {
        state.selectedAddedBy.add(by);
        e.target.classList.add('active');
      }
      render();
    });
   // ===== SURPRISE ME =====
    async function fetchPosterUrl(item) {
      const id = getItemId(item);
      if (posterCache[id] !== undefined) {
        return posterCache[id] === 'no-poster' ? null : posterCache[id];
      }
      const endpoint = item.type === "Movie" ? "movie" : "tv";
      const query = encodeURIComponent(item.title);
      const url = `https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_API_KEY}&query=${query}&year=${item.year}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const result = data.results && data.results[0];
        if (result && result.poster_path) {
          const imgUrl = `https://image.tmdb.org/t/p/w342${result.poster_path}`;
          posterCache[id] = imgUrl;
          return imgUrl;
        }
        posterCache[id] = 'no-poster';
        return null;
      } catch {
        posterCache[id] = 'no-poster';
        return null;
      }
    }

    async function rollSurprise() {
      const filtered = getFiltered();
      if (filtered.length === 0) {
        alert("No titles match your filters. Try removing some!");
        return;
      }
      const pick = filtered[Math.floor(Math.random() * filtered.length)];

      document.getElementById('overlay-title').textContent = pick.title;
      document.getElementById('overlay-meta').textContent =
        `${pick.year} · ${pick.category} · ${pick.type}`;

      const posterDiv = document.getElementById('overlay-poster');
      posterDiv.style.backgroundImage = '';
      const url = await fetchPosterUrl(pick);
      if (url) posterDiv.style.backgroundImage = `url('${url}')`;

      document.getElementById('surprise-overlay').classList.remove('hidden');
    }

    function closeSurprise() {
      document.getElementById('surprise-overlay').classList.add('hidden');
    }

    document.getElementById('surprise-btn').addEventListener('click', rollSurprise);
    document.getElementById('overlay-roll-again').addEventListener('click', rollSurprise);
    document.getElementById('overlay-close').addEventListener('click', closeSurprise);

    // Click backdrop or press Escape to close
    document.getElementById('surprise-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'surprise-overlay') closeSurprise();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSurprise();
    });
// ===== CARD TAP = TOGGLE WATCHED =====
    document.getElementById('content').addEventListener('click', (e) => {
      if (state.activeTab === 'Home') {
        switchToTab('Movie');
        return;
      }
      const card = e.target.closest('.card');
      if (!card) return;
      const id = card.dataset.id;
      toggleWatched(id);
      render();
    });

    // ===== FIREBASE SYNC =====
    function startFirebaseSync() {
      if (!window.fbdb) {
        setTimeout(startFirebaseSync, 200);
        return;
      }
      const { fbdb, fbCollection, fbOnSnapshot } = window;
      fbOnSnapshot(fbCollection(fbdb, 'watchlist'), (snapshot) => {
        firebaseWatchlist = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        firebaseReady = true;
        renderCategoryChips();
        renderEraChips();
        render();
      });
    }
    window.addEventListener('firebase-ready', startFirebaseSync);
    startFirebaseSync();
    // ===== + ADD BUTTON =====
    const addBtn = document.getElementById('add-btn');
    const addOverlay = document.getElementById('add-overlay');
    const addClose = document.getElementById('add-close');
    const addSubmit = document.getElementById('add-submit');
    const addStatus = document.getElementById('add-status');

    function openAdd() {
      addOverlay.classList.remove('hidden');
      document.getElementById('add-title').focus();
    }
    function closeAdd() {
      addOverlay.classList.add('hidden');
      document.getElementById('add-title').value = '';
      document.getElementById('add-year').value = '';
      addStatus.textContent = '';
      addStatus.className = 'add-status';
    }

    addBtn.addEventListener('click', openAdd);
    addClose.addEventListener('click', closeAdd);
    addOverlay.addEventListener('click', (e) => {
      if (e.target.id === 'add-overlay') closeAdd();
    });

    addSubmit.addEventListener('click', async () => {
      const title = document.getElementById('add-title').value.trim();
      const year = parseInt(document.getElementById('add-year').value);
      const type = document.getElementById('add-type').value;
      const category = document.getElementById('add-category').value;
      const era = document.getElementById('add-era').value;

      if (!title) {
        addStatus.textContent = 'Please enter a title';
        addStatus.className = 'add-status error';
        return;
      }
      if (!year || year < 1900 || year > 2030) {
        addStatus.textContent = 'Please enter a valid year';
        addStatus.className = 'add-status error';
        return;
      }
      if (!window.fbdb) {
        addStatus.textContent = 'Firebase not ready, wait a sec';
        addStatus.className = 'add-status error';
        return;
      }

      addSubmit.disabled = true;
      addStatus.textContent = 'Adding...';
      addStatus.className = 'add-status';

      try {
        const { fbdb, fbCollection, fbAddDoc } = window;
        await fbAddDoc(fbCollection(fbdb, 'watchlist'), {
          title, year, type, category, era,
          addedBy: getIdentity(),
          addedAt: new Date().toISOString()
        });
        addStatus.textContent = `✨ ${title} added!`;
        addStatus.className = 'add-status success';
        setTimeout(closeAdd, 1200);
      } catch (err) {
        console.error(err);
        addStatus.textContent = 'Something went wrong, try again';
        addStatus.className = 'add-status error';
      } finally {
        addSubmit.disabled = false;
      }
    });
   
     </script>
</body>
</html>
